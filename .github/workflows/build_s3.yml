name: Build ESP32-S3 (xiaozhi OLED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Show firmware size
        shell: bash
        run: idf.py size || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32s3-fw
          path: |
            build/xiaozhi.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/generated_assets.bin
          if-no-files-found: error
          retention-days: 30
